name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *' # daily, to pick up new photos in the Drive Background folder

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pick random Japan background photos
        run: node scripts/fetch-japan.mjs
      - name: Refresh citation numbers from Google Scholar
        run: node scripts/fetch-scholar.mjs
      - name: Sync home backgrounds from Google Drive
        run: node scripts/fetch-backgrounds.mjs
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          BG_FOLDER_ID: ${{ secrets.BG_FOLDER_ID }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
