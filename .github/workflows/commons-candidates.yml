name: Commons candidates
on:
  workflow_dispatch:
    inputs:
      queries:
        description: JSON map of key -> search terms
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/commons-candidates.mjs
        env: { QUERIES: '${{ inputs.queries }}' }
      - run: |
          git checkout --orphan candidates
          git rm -rq --cached .
          git add candidates
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm candidates
          git push -f origin candidates
